name: lulu_remote
description: "LULU Remote — a thin Flutter launcher shell for Sunshine + Moonlight. The launcher only stores devices and launches the stock engines; it does not implement video, NAT traversal or encryption itself."
publish_to: "none"
version: 0.3.0-beta.8+17

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Device list (non-secret fields only). Secrets live in flutter_secure_storage.
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  # Open Sunshine web UI / download pages as a fallback.
  url_launcher: ^6.3.1
  # Windows mesh status XML diagnostics.
  xml: ^6.5.0
  crypto: ^3.0.3
  cryptography: 2.7.0
  file_selector: 1.0.3
  desktop_drop: 0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
