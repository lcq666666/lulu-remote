plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def versionLine = (file('../../pubspec.yaml').getText('UTF-8') =~ /(?m)^version: ([0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.]+)?)\+(\d+)\s*$/)
if (!versionLine.find()) {
    throw new GradleException('Invalid launcher version in pubspec.yaml')
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode', versionLine.group(2))
def flutterVersionName = localProperties.getProperty('flutter.versionName', versionLine.group(1))
android {
    namespace "com.lulu.remote"
    compileSdk 34
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.lulu.remote"
        // Moonlight Android needs Android 5.0+; LULU matches it.
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    def sharedDebugKeystore = System.getenv('LULU_ANDROID_DEBUG_KEYSTORE')
    if (sharedDebugKeystore) {
        signingConfigs {
            debug {
                storeFile file(sharedDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    def keyProperties = new Properties()
    def keyPropertiesFile = rootProject.file('key.properties')
    if (keyPropertiesFile.exists()) {
        keyPropertiesFile.withInputStream { keyProperties.load(it) }
        signingConfigs {
            release {
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source '../..'
}
