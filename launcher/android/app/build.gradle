plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Both APKs ship together. Ignore Flutter's generated local.properties
// version overrides so the launcher and companion always match the manifest.
def versionLine = (file('../../pubspec.yaml').getText('UTF-8') =~ /(?m)^version: ([0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.]+)?)\+(\d+)\s*$/)
if (!versionLine.find()) {
    throw new GradleException('Invalid launcher version in pubspec.yaml')
}
android {
    namespace "com.lulu.remote"
    compileSdk 34
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.lulu.remote"
        // Moonlight Android needs Android 5.0+; LULU matches it.
        minSdk 21
        targetSdk 34
        versionCode versionLine.group(2).toInteger()
        versionName versionLine.group(1)
    }

    def sharedDebugKeystore = System.getenv('LULU_ANDROID_DEBUG_KEYSTORE')
    if (sharedDebugKeystore) {
        signingConfigs {
            debug {
                storeFile file(sharedDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    def keyProperties = new Properties()
    def keyPropertiesFile = rootProject.file('key.properties')
    if (keyPropertiesFile.exists()) {
        keyPropertiesFile.withInputStream { keyProperties.load(it) }
        signingConfigs {
            release {
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source '../..'
}
