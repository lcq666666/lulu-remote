# Build LULU Remote installers — GitHub Actions (the ONLY place a
# release build happens).
#
# The point of this workflow: NOBODY needs Flutter, Visual Studio,
# Android SDK, or Inno Setup to USE LULU. Those tools live only here,
# in CI. Users download finished installers from Releases / Artifacts.
#
# Triggers: every push to main (artifacts only) and every v* tag
# (artifacts + a GitHub Release with the installers attached).
#
# First run (2026-11-26, run #1) failed BEFORE any job ran: GitHub
# rejected `if: ${{ secrets.… }}` on two steps with
# "Unrecognized named-value: 'secrets'". So the keystore check is now
# done inside a `run:` step (secrets ARE available there) and its
# output drives the two build steps. The first green run is still the
# real test of the .iss files, the fetch script, and the silent-install
# switches (see installer/README.md).

name: Build LULU Remote installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to attach assets

jobs:
  # --- 1. Tests (Linux, fast) -------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Dependencies
        working-directory: launcher
        run: flutter pub get
      - name: Static analysis
        working-directory: launcher
        run: flutter analyze
      - name: Launcher tests
        working-directory: launcher
        run: flutter test
      - name: Pairing worker tests and analysis
        working-directory: pairing_worker
        run: |
          dart pub get
          dart analyze lib bin test
          dart test

  # --- 2. Windows: one installer for both roles -------------------------
  build-windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Build launcher (Windows)
        working-directory: launcher
        run: |
          flutter create --platforms=windows --project-name=lulu_remote .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
      - name: Build and stage the Windows pairing worker
        shell: pwsh
        run: ./installer/scripts/build-pairing-worker.ps1
      - name: Test compiled pairing IPC
        working-directory: launcher
        shell: pwsh
        run: |
          $env:LULU_PAIRING_TEST_EXE = (Resolve-Path 'build/windows/x64/runner/Release/lulu_pairing_worker.exe').Path
          flutter test test/pairing_worker_client_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ../pairing_worker
          dart test test/worker_process_test.dart
      - name: Fetch Moonlight + Sunshine (verify hashes, fetch LICENSEs)
        shell: pwsh
        run: ./installer/scripts/fetch-components.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $language = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/Languages/ChineseSimplified.isl'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $language
      - name: Build LULU Windows installer
        run: iscc installer\client\LULU-Remote-Setup.iss
      - name: Build LULU Windows host installer
        run: iscc installer\host\LULU-Host-Setup.iss
      - name: Build portable Windows ZIP
        run: ./installer/scripts/build-portable.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            installer/dist/LULU-Remote-Setup-*.exe
            installer/dist/LULU-Host-Setup-*.exe
            installer/dist/LULU-Remote-Portable-*.zip
            installer/vendor/MANIFEST.md
          if-no-files-found: error

  # --- 3. Android: APK ----------------------------------------------------
  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      # secrets cannot be used in a step `if:` (GitHub rejects the file),
      # so check it here in `run:` and let the two build steps read the output.
      - name: Check keystore configured
        id: keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Generate missing Android runner files
        working-directory: launcher
        run: flutter create --platforms=android --org=com.lulu --project-name=remote --no-pub .
      - name: Prepare companion Gradle wrapper
        run: |
          cp launcher/android/gradlew pairing_worker/android_app/android/
          cp launcher/android/gradle/wrapper/gradle-wrapper.jar pairing_worker/android_app/android/gradle/wrapper/
      - name: Configure a shared release signing identity
        if: ${{ steps.keystore.outputs.configured == 'true' }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/lulu-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$key_file"
          for app in launcher pairing_worker/android_app; do
            cat > "$app/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$key_file
          EOF
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Build matching Android APKs
        env:
          HAS_RELEASE_KEY: ${{ steps.keystore.outputs.configured }}
        run: |
          mode=debug
          if [ "$HAS_RELEASE_KEY" = true ]; then
            mode=release
          else
            export LULU_ANDROID_DEBUG_KEYSTORE="$RUNNER_TEMP/lulu-debug.keystore"
            keytool -genkeypair -keystore "$LULU_ANDROID_DEBUG_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          for app in launcher pairing_worker/android_app; do
            (cd "$app" && flutter pub get && flutter build apk "--$mode")
          done
          mkdir -p android-dist
          cp "launcher/build/app/outputs/flutter-apk/app-$mode.apk" "android-dist/LULU-Remote-$mode.apk"
          cp "pairing_worker/android_app/build/app/outputs/flutter-apk/app-$mode.apk" "android-dist/LULU-Pairing-Worker-$mode.apk"
          git archive --format=zip --output=android-dist/LULU-Pairing-Worker-Source.zip HEAD pairing_worker installer/scripts/build-pairing-worker.ps1 .github/workflows/build.yml
      - name: Verify matching Android signatures
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          certificate() {
            local verified
            verified="$("$apksigner" verify --print-certs "$1")" || return 1
            # apksigner may label the APK signer by number or signing scheme.
            sed -En 's/^(V[0-9.]+ )?Signer[^:]*:? certificate SHA-256 digest: *([[:xdigit:]:]+)[[:space:]]*$/\2/ip' <<< "$verified" | tr -d ':' | sort -u
          }
          launcher_cert="$(certificate android-dist/LULU-Remote-*.apk)"
          worker_cert="$(certificate android-dist/LULU-Pairing-Worker-*.apk)"
          if [[ ! "$launcher_cert" =~ ^[[:xdigit:]]{64}$ || "$launcher_cert" != "$worker_cert" ]]; then
            echo '::error::Expected the launcher and pairing worker to have one matching signing certificate.'
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-dist/
          if-no-files-found: error

  # --- 4. Release (tags only) ---------------------------------------------
  release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installers/dist/*.exe
            dist/windows-installers/dist/*.zip
            dist/android-apk/*.apk
            dist/android-apk/LULU-Pairing-Worker-Source.zip
            dist/windows-installers/vendor/MANIFEST.md
          body: |
            ### 0.2.1 更新

            - Windows 新增侧栏、双列设备卡片和常驻画质栏，并重新设计「让别人连接我」页面。
            - Android 改为单列设备卡片和底部导航，设备菜单继续提供 Moonlight 连接排障。
            - 两端新增深浅主题切换，统一添加电脑、四格 PIN、配对进度和连接诊断的样式。

            ### Windows

            两台电脑都可下载 `LULU-Remote-Setup-0.2.1.exe` 覆盖安装。安装前可从托盘退出正在运行的 LULU。也可下载 `LULU-Remote-Portable-0.2.1-x64.zip`，解压整个文件夹后打开 `lulu_remote.exe`。
            被控电脑在「让别人连接我」中开启远程控制并设置本机管理账号。需要专门部署被控电脑时，也可用 `LULU-Host-Setup-0.2.1.exe`，它会设置 Windows 登录后自动在托盘启动。
            控制电脑在「连接电脑」中填入被控电脑显示的地址，然后发起配对。

            ### Android

            从同一个构建下载并安装 `LULU-Remote-*.apk` 和 `LULU-Pairing-Worker-*.apk`。文件名末尾为 `debug` 的 APK 使用调试签名。
            手机仍需安装 Moonlight，并在里面完成首次配对。跨网连接还需要配置组网。

            组件版本、校验值和许可信息见 `MANIFEST.md`。
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
