# Build LULU Remote installers — GitHub Actions (the ONLY place a
# release build happens).
#
# The point of this workflow: NOBODY needs Flutter, Visual Studio,
# Android SDK, or Inno Setup to USE LULU. Those tools live only here,
# in CI. Users download finished installers from Releases / Artifacts.
#
# Triggers: every push to main (artifacts only) and every v* tag
# (artifacts + a GitHub Release with the installers attached).
#
# First run (2026-11-26, run #1) failed BEFORE any job ran: GitHub
# rejected `if: ${{ secrets.… }}` on two steps with
# "Unrecognized named-value: 'secrets'". So the keystore check is now
# done inside a `run:` step (secrets ARE available there) and its
# output drives the two build steps. The first green run is still the
# real test of the .iss files, the fetch script, and the silent-install
# switches (see installer/README.md).

name: Build LULU Remote installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to attach assets

jobs:
  # --- 1. Tests (Linux, fast) -------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Dependencies
        working-directory: launcher
        run: flutter pub get
      - name: Static analysis
        working-directory: launcher
        run: flutter analyze
      - name: Launcher tests
        working-directory: launcher
        run: flutter test
      - name: Pairing worker tests and analysis
        working-directory: pairing_worker
        run: |
          dart pub get
          dart analyze lib bin test
          dart test

  activation-server:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.activation.outputs.enabled }}
      public-key: ${{ steps.activation.outputs.public_key }}
      server-url: ${{ steps.activation.outputs.server_url }}
      version: ${{ steps.activation.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Test activation server
        working-directory: server
        run: go test -count=1 ./...
      - name: Test launcher against Go server
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Cross-check the activation protocol
        run: |
          (cd server && go build -trimpath -o "$RUNNER_TEMP/lulu-auth-test" .)
          cd launcher
          flutter pub get
          LULU_AUTH_TEST_EXE="$RUNNER_TEMP/lulu-auth-test" flutter test test/activation_integration_test.dart
      - name: Check activation package configuration
        id: activation
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.LULU_ACTIVATION_PREVIEW_PUBLIC_KEY != '')
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.LULU_ACTIVATION_PUBLIC_KEY }}
          RELEASE_SERVER_URL: ${{ vars.LULU_ACTIVATION_SERVER }}
          PREVIEW_PUBLIC_KEY: ${{ vars.LULU_ACTIVATION_PREVIEW_PUBLIC_KEY }}
          PREVIEW_SERVER_URL: ${{ vars.LULU_ACTIVATION_PREVIEW_SERVER }}
        run: |
          python3 - <<'PY'
          import base64, ipaddress, os, pathlib, re, urllib.parse
          release = os.environ['GITHUB_REF'].startswith('refs/tags/v')
          prefix = 'RELEASE' if release else 'PREVIEW'
          key = os.environ[prefix + '_PUBLIC_KEY']
          url = os.environ[prefix + '_SERVER_URL']
          if not re.fullmatch(r'https?://[0-9.]+:[0-9]+/?', url):
              raise SystemExit('Set the activation group URL to an IPv4 address with an explicit port.')
          address = urllib.parse.urlsplit(url)
          if not re.fullmatch(r'[A-Za-z0-9_-]{43}', key) or len(base64.urlsafe_b64decode(key+'=')) != 32:
              raise SystemExit('Set LULU_ACTIVATION_PUBLIC_KEY to the output of lulu-auth init.')
          ip = ipaddress.IPv4Address(address.hostname or '')
          if (address.scheme not in ('http', 'https') or not address.port or address.username is not None
              or address.path not in ('', '/') or address.query or address.fragment
              or not any(ip in ipaddress.IPv4Network(net) for net in ('100.64.0.0/10', '10.0.0.0/8'))):
              raise SystemExit('Set LULU_ACTIVATION_SERVER to the overlay IPv4 HTTP URL, including its port.')
          pubspec = pathlib.Path('launcher/pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version: ([0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.]+)?)\+\d+$', pubspec, re.M)
          if not match or (release and os.environ['GITHUB_REF_NAME'] != 'v' + match[1]):
              raise SystemExit('Invalid launcher version or mismatched release tag.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'enabled=true\npublic_key={key}\nserver_url={url}\nversion={match[1]}', file=output)
          PY
      - name: Build Windows server and keygen
        if: steps.activation.outputs.enabled == 'true'
        working-directory: server
        env:
          VERSION: ${{ steps.activation.outputs.version }}
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o "dist/lulu-auth-$VERSION-windows-x64.exe" .
          cp "dist/lulu-auth-$VERSION-windows-x64.exe" "dist/lulu-keygen-$VERSION-windows-x64.exe"
      - name: Upload server and keygen
        if: steps.activation.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: activation-server
          path: server/dist/*.exe
          if-no-files-found: error

  # --- 2. Windows: one installer for both roles -------------------------
  build-windows:
    needs: [test, activation-server]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Build launcher (Windows)
        working-directory: launcher
        env:
          ACTIVATION_ENABLED: ${{ needs.activation-server.outputs.enabled }}
          PUBLIC_KEY: ${{ needs.activation-server.outputs.public-key }}
          ACTIVATION_SERVER: ${{ needs.activation-server.outputs.server-url }}
        run: |
          flutter create --platforms=windows --project-name=lulu_remote .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $activation = @()
          if ($env:ACTIVATION_ENABLED -eq 'true') {
            $activation = @('--dart-define=LULU_ACTIVATION_REQUIRED=true', "--dart-define=LULU_ACTIVATION_PUBLIC_KEY=$env:PUBLIC_KEY", "--dart-define=LULU_ACTIVATION_SERVER=$env:ACTIVATION_SERVER")
          }
          flutter build windows --release @activation
      - name: Build and stage the Windows pairing worker
        shell: pwsh
        run: ./installer/scripts/build-pairing-worker.ps1
      - name: Test compiled pairing IPC
        working-directory: launcher
        shell: pwsh
        run: |
          $env:LULU_PAIRING_TEST_EXE = (Resolve-Path 'build/windows/x64/runner/Release/lulu_pairing_worker.exe').Path
          flutter test test/pairing_worker_client_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ../pairing_worker
          dart test test/worker_process_test.dart
      - name: Fetch Moonlight + Sunshine (verify hashes, fetch LICENSEs)
        shell: pwsh
        run: ./installer/scripts/fetch-components.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $language = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/Languages/ChineseSimplified.isl'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $language
      - name: Build LULU Windows installer
        run: iscc installer\client\LULU-Remote-Setup.iss
      - name: Build LULU Windows host installer
        run: iscc installer\host\LULU-Host-Setup.iss
      - name: Build portable Windows ZIP
        run: ./installer/scripts/build-portable.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            installer/dist/LULU-Remote-Setup-*.exe
            installer/dist/LULU-Host-Setup-*.exe
            installer/dist/LULU-Remote-Portable-*.zip
            installer/vendor/MANIFEST.md
          if-no-files-found: error

  # --- 3. Android: APK ----------------------------------------------------
  build-android:
    needs: [test, activation-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      # secrets cannot be used in a step `if:` (GitHub rejects the file),
      # so check it here in `run:` and let the two build steps read the output.
      - name: Check keystore configured
        id: keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Generate missing Android runner files
        working-directory: launcher
        run: flutter create --platforms=android --org=com.lulu --project-name=remote --no-pub .
      - name: Prepare companion Gradle wrapper
        run: |
          cp launcher/android/gradlew pairing_worker/android_app/android/
          cp launcher/android/gradle/wrapper/gradle-wrapper.jar pairing_worker/android_app/android/gradle/wrapper/
      - name: Configure a shared release signing identity
        if: ${{ steps.keystore.outputs.configured == 'true' }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/lulu-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$key_file"
          for app in launcher pairing_worker/android_app; do
            cat > "$app/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$key_file
          EOF
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Build matching Android APKs
        env:
          HAS_RELEASE_KEY: ${{ steps.keystore.outputs.configured }}
          ACTIVATION_ENABLED: ${{ needs.activation-server.outputs.enabled }}
          PUBLIC_KEY: ${{ needs.activation-server.outputs.public-key }}
          ACTIVATION_SERVER: ${{ needs.activation-server.outputs.server-url }}
        run: |
          mode=debug
          if [ "$HAS_RELEASE_KEY" = true ]; then
            mode=release
          else
            export LULU_ANDROID_DEBUG_KEYSTORE="$RUNNER_TEMP/lulu-debug.keystore"
            keytool -genkeypair -keystore "$LULU_ANDROID_DEBUG_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          activation=()
          if [[ "$ACTIVATION_ENABLED" == true ]]; then
            activation+=("--dart-define=LULU_ACTIVATION_REQUIRED=true"
              "--dart-define=LULU_ACTIVATION_PUBLIC_KEY=$PUBLIC_KEY"
              "--dart-define=LULU_ACTIVATION_SERVER=$ACTIVATION_SERVER")
          fi
          (cd launcher && flutter pub get && flutter build apk "--$mode" "${activation[@]}")
          (cd pairing_worker/android_app && flutter pub get && flutter build apk "--$mode")
          mkdir -p android-dist
          cp "launcher/build/app/outputs/flutter-apk/app-$mode.apk" "android-dist/LULU-Remote-$mode.apk"
          cp "pairing_worker/android_app/build/app/outputs/flutter-apk/app-$mode.apk" "android-dist/LULU-Pairing-Worker-$mode.apk"
          git archive --format=zip --output=android-dist/LULU-Pairing-Worker-Source.zip HEAD pairing_worker installer/scripts/build-pairing-worker.ps1 .github/workflows/build.yml
      - name: Verify matching Android signatures
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          certificate() {
            local verified
            verified="$("$apksigner" verify --print-certs "$1")" || return 1
            # apksigner may label the APK signer by number or signing scheme.
            sed -En 's/^(V[0-9.]+ )?Signer[^:]*:? certificate SHA-256 digest: *([[:xdigit:]:]+)[[:space:]]*$/\2/ip' <<< "$verified" | tr -d ':' | sort -u
          }
          launcher_cert="$(certificate android-dist/LULU-Remote-*.apk)"
          worker_cert="$(certificate android-dist/LULU-Pairing-Worker-*.apk)"
          if [[ ! "$launcher_cert" =~ ^[[:xdigit:]]{64}$ || "$launcher_cert" != "$worker_cert" ]]; then
            echo '::error::Expected the launcher and pairing worker to have one matching signing certificate.'
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-dist/
          if-no-files-found: error

  # --- 4. Release (tags only) ---------------------------------------------
  release:
    needs: [build-windows, build-android, activation-server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installers/dist/*.exe
            dist/windows-installers/dist/*.zip
            dist/android-apk/*.apk
            dist/activation-server/*.exe
            dist/android-apk/LULU-Pairing-Worker-Source.zip
            dist/windows-installers/vendor/MANIFEST.md
          body: |
            ### 在线激活

            本版首次联网激活需要作者发放的一次性密钥。激活后，已激活设备仍可离线启动。
            作者在激活服务器上运行 `lulu-auth-*-windows-x64.exe init` 初始化，运行 `serve --listen 组网IP:8765` 启动服务。使用 `lulu-keygen-*-windows-x64.exe keys generate --count 20 --note 实验室` 生成密钥。部署与备份见 `server/README.md`。

            ### Windows 连接修复

            - 直接从 LULU 的设备卡进入桌面。首次配对会用已保存的地址打开 Moonlight 的 PIN 窗口，无需到 Moonlight 首页重新添加或输入地址。
            - LULU 先检查随包和系统安装的 Moonlight 是否能运行，必要时在应用内准备组件。设备卡显示连接端口或组网相关的错误原因。
            - F01 提供被控端本机黑屏和图片预览。F02 提供远程结束后自动锁屏开关，已通过双机验收。

            两台电脑都可以用 `LULU-Remote-Setup-*.exe` 覆盖同类型安装。安装前先从托盘退出正在运行的 LULU。用 `LULU-Host-Setup-*.exe` 部署专用主机时，会配置登录后自动运行托盘。便携 ZIP 需解压整个文件夹，再打开 `lulu_remote.exe`。

            被控电脑在「让别人连接我」中开启远程控制并配置本机管理账号。控制电脑在 LULU 点已保存设备的连接按钮。首次连接时，在被控电脑的 LULU 托盘提示或 Sunshine 管理页确认 PIN。

            ### Android

            安装同一次构建提供的 `LULU-Remote-*.apk` 和 `LULU-Pairing-Worker-*.apk`。以 `debug` 结尾的 APK 使用调试签名。手机仍需安装 Moonlight，并按原有安卓流程配对。

            组件版本、校验值和许可信息见 `MANIFEST.md`。
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
